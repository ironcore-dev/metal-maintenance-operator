version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - logcheck
  settings:
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
          - goconst
        path: internal/*
      - linters:
          - dupl
          - lll
          - goconst
        path: bmc/*
      # Server.spec.power is deprecated (see ironcore-dev/metal-operator). The field
      # is an internal actuator variable that controllers still write while traversing
      # the state machine and as surrogate input from ServerMaintenance. Legacy access
      # remains until the field is fully removed in a future release.
      - linters:
          - staticcheck
        text: "SA1019.*server\\.Spec\\.Power is deprecated"
      # Server.spec.biosSettingsRef and BMC.spec.biosSettingRef are deprecated
      # (see ironcore-dev/metal-operator) but are still used here as the
      # single-active-claimant reference between a Server/BMC and its
      # BIOSSettings/BMCSettings object. Legacy access remains until the
      # fields are fully removed in a future release.
      - linters:
          - staticcheck
        text: "SA1019.*Spec\\.(BIOSSettingsRef|BMCSettingRef) is deprecated"
    paths:
      - third_party
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party
      - builtin$
      - examples$