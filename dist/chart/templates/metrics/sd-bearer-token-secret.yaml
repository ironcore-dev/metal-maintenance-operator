# Bearer-token secret for the /sd/bmcs service-discovery endpoint.
# The manager mounts this at /var/run/secrets/sd-bearer-token/token and reads it
# at start-up via --sd-bearer-token-file. Prometheus scrape jobs configure the
# same token via bearer_token_file in their http_sd_configs.
#
# When metrics.sdBearerToken.existingSecret is set, that secret is used instead
# of creating a new one here. The referenced secret must have a "token" key.
{{- if not .Values.metrics.sdBearerToken.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "metal-maintenance-operator.resourceName" (dict "suffix" "sd-bearer-token" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "metal-maintenance-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  token: {{ required "metrics.sdBearerToken.token is required when metrics.sdBearerToken.enabled=true and metrics.sdBearerToken.existingSecret is not set" .Values.metrics.sdBearerToken.token | quote }}
{{- end }}
{{- end }}
