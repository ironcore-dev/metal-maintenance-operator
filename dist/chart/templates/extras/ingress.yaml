{{- if .Values.ingress.enabled }}
{{- $domain := tpl .Values.ingress.domain . }}
---
# Service backing the sanitization report endpoint (port 8082). BMCs and
# sanitizer pods POST to this via the Ingress rule at path /.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "metal-maintenance-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - name: sanitized
    port: {{ .Values.ingress.port }}
    protocol: TCP
    targetPort: {{ .Values.ingress.port }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  type: ClusterIP
---
# Single Ingress for both backends on this operator's hostname:
#   /             → port 8082 (sanitization report callback)
#   /serverevents → port 9092 (Redfish push event receiver, when telemetry enabled)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "metal-maintenance-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.tls }}
  tls:
  - secretName: tls-{{ include "metal-maintenance-operator.fullname" . }}
    hosts: [ {{ $domain }} ]
  {{- end }}
  rules:
  - host: {{ $domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "metal-maintenance-operator.fullname" . }}
            port:
              number: {{ .Values.ingress.port }}
{{- if and .Values.telemetry.events.ingress.enabled .Values.telemetry.events.serviceEnabled }}
      - path: /serverevents
        pathType: Prefix
        backend:
          service:
            name: {{ include "metal-maintenance-operator.resourceName" (dict "suffix" "controller-manager-telemetry-events" "context" $) }}
            port:
              number: {{ .Values.telemetry.events.port }}
{{- end }}
{{- end }}
