{{- if .Values.telemetry.config.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.telemetry.config.configMapName }}
  namespace: {{ .Values.telemetry.config.namespace | default (include "metal-maintenance-operator.namespaceName" .) }}
data:
  config.yaml: |
    apiVersion: telemetry.metal.ironcore.dev/v1alpha1
    subscriptionReconcileInterval: {{ .Values.telemetry.config.subscriptionReconcileInterval }}
    perBMCTimeout: {{ .Values.telemetry.config.perBMCTimeout }}
    {{- with .Values.telemetry.config.testEventInterval }}
    testEventInterval: {{ . }}
    {{- end }}
    {{- with .Values.telemetry.config.testEventTimeout }}
    testEventTimeout: {{ . }}
    {{- end }}
    {{- if .Values.telemetry.config.eventBasedHardware }}
    eventBasedHardware:
{{ .Values.telemetry.config.eventBasedHardware | toYaml | indent 6 }}
    {{- end }}
{{- end }}
