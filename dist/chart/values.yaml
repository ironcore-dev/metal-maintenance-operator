owner-info:
  support-group: containers
  helm-chart-url: https://github.com/ironcore-dev/metal-maintenance-operator/tree/main/dist/chart

## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  replicas: 1

  image:
    repository: controller
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  args:
    - "--leader-elect"
    - "--sanitization-namespace={{ .Values.sanitization.namespace }}"
    - "--sanitization-image={{ .Values.sanitization.image }}"
    - "--report-base-url={{ .Values.sanitization.reportBaseURL }}"
    - "--manager-namespace={{ .Release.Namespace }}"

  ## Health probes.
  ## The manager serves the liveness (/healthz) and readiness (/readyz) endpoints on this port.
  ##
  healthProbe:
    # Health probe server port
    port: 8081

  ## Additional environment variables for the manager container.
  ##
  ## POD_NAMESPACE is always injected so the telemetry pipeline and
  ## leader-election can locate their ConfigMap in-cluster without
  ## requiring explicit flag overrides.
  ##
  env:
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace

  ## Env overrides (--set manager.envOverrides.VAR=value)
  ## Same name in env above: this value takes precedence.
  ##
  envOverrides: {}

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding (release namespace only)
  ##
  namespaced: true

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs
    ##
    enabled: false

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (required when enabled=false)
  ## Set to "default" to use the namespace default ServiceAccount
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: false

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enabled: false

## Webhook server configuration.
## Requires certManager.enabled=true for TLS certificate provisioning.
##
webhook:
  enabled: false
  # Webhook server port
  port: 9443

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false

  ## Custom ServiceMonitor labels
  ##
  # labels: {}

  ## Custom ServiceMonitor annotations
  ##
  # annotations: {}

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false

## Telemetry pipeline configuration.
##
## The pipeline itself is gated by the operator binary's --enable-telemetry
## flag; this section controls the chart's view of associated resources.
##
telemetry:
  events:
    # Install a Service exposing the operator's :9092 event receiver so
    # BMCs can POST events to a stable DNS name. Leave true even when
    # --enable-telemetry is off: the Service is a no-op until the
    # listener binds, and removing it later would force a Service-name
    # change in --telemetry-receiver-url. Operators who never run the
    # telemetry pipeline can set this to false to save the resource.
    serviceEnabled: true
    # Port the Service exposes; should match the targetPort baked into
    # manager.ports[*].containerPort.
    port: 9092
    # Expose the event receiver via the same Ingress as the operator.
    # When enabled, a /serverevents path is added to the Ingress so
    # BMCs outside the cluster can POST Redfish events (alerts and
    # MetricReports) through the ingress controller.
    # Requires ingress.enabled: true.
    # Gardener automatically creates a NetworkPolicy allowing the
    # ingress controller to reach port 9092 once this path is present.
    ingress:
      enabled: false

  ## Telemetry collector ConfigMap configuration.
  ## Creates the ConfigMap the operator reads to configure Redfish event
  ## subscriptions and pipeline health checks (--telemetry-config-name /
  ## --telemetry-config-namespace flags).
  ##
  config:
    ## Set to true to create the telemetry-collector-config ConfigMap.
    ##
    enabled: false
    ## Name of the ConfigMap; must match --telemetry-config-name (default: telemetry-collector-config).
    ##
    configMapName: "telemetry-collector-config"
    ## Namespace where the ConfigMap is deployed; must match --telemetry-config-namespace.
    ## Defaults to the Helm release namespace when empty.
    ##
    namespace: ""
    ## How often the operator re-verifies Redfish subscriptions. Bounds: 5s – 24h.
    ##
    subscriptionReconcileInterval: "10m"
    ## Per-Redfish-operation deadline for subscription management. Bounds: 1s – 10m.
    ##
    perBMCTimeout: "30s"
    ## End-to-end health check interval; leave empty to disable. Bounds: 1m – 7d.
    ##
    testEventInterval: ""
    ## Timeout for the health check round-trip. Bounds: 5s – 5m.
    ##
    testEventTimeout: ""
    ## Vendor/model rows that opt into event-based subscription.
    ## See config/telemetry/configmap.yaml for full field documentation.
    ##
    eventBasedHardware: []
    ## Example:
    # eventBasedHardware:
    #   - vendor: "Dell Inc."
    #     models: ["PowerEdge R760", "PowerEdge R660"]
    #     testMessageId: "FAN0001"
    #     testSeverity: "Informational"
    #   - vendor: "HPE"
    #     models: ["*"]
    #     testMessageId: "iLOEvents.1.0.TestAlert"
    #     testSeverity: "OK"
    #     testOriginOfCondition: "/redfish/v1/Managers/1"
    #   - vendor: "Lenovo"
    #     models: ["*"]
    #     testMessageId: "EventRegistry.1.0.0.FQXSPCA0012I"

## Additional Secret resources to render in the release namespace.
## Useful for operator-pattern credentials (e.g. Gardener token-requestor secrets).
##
# additionalSecrets:
#   - name: my-secret
#     labels:
#       resources.gardener.cloud/purpose: token-requestor
#     annotations:
#       serviceaccount.resources.gardener.cloud/name: my-sa
#     stringData:
#       token: ""
additionalSecrets: []

## Sanitization configuration.
## All three fields are required; the manager will refuse to start without them.
##
sanitization:
  ## Namespace where sanitization ServerClaims are created.
  namespace: "metal-maintenance-sanitization"
  ## OS image for the sanitization job.
  image: "ghcr.io/ironcore-dev/sanitizer:f7cd53a0390a0f17d4b6572c96e646918327ba60"
  ## Base URL of the sanitization callback server
  ## (e.g. http://metal-maintenance-operator.my-ns.svc.cluster.local:8082).
  ## Sanitizers POST to <reportBaseURL>/<sanitizationUID> when done.
  reportBaseURL: "http://metal-maintenance-operator.${RELEASE_NAMESPACE}.svc.cluster.local:8082"

## Ingress and Service for this operator's external-facing endpoints.
## A single Ingress on the configured domain hosts two backends:
##   /             → port 8082 (sanitization report callback for sanitizer pods)
##   /serverevents → port 9092 (Redfish push receiver for BMC alerts and MetricReports,
##                              when telemetry.events.ingress.enabled is also true)
## Set enabled: true and provide domain to deploy the Ingress.
##
ingress:
  enabled: false

  ## Port the sanitization report handler listens on.
  ##
  port: 8082

  ## Domain for the ingress. Supports tpl rendering.
  ## Example: "metal-maintenance-operator.{{ .Values.global.clusterType }}.{{ .Values.global.region }}.{{ .Values.global.tld }}"
  ##
  domain: ""

  ## Enable TLS for the ingress.
  ##
  tls: true

  ## Additional ingress annotations.
  ##
  annotations: {}

## Namespaces to create for ServerReadinessCheck objects.
## Argora (or other spec writers) create ServerReadinessCheck objects in these namespaces.
## Example: ["metal-servers"]
serverReadinessNamespaces: []

## Additional Kubernetes objects to deploy alongside the operator.
## Accepts any valid Kubernetes manifest as a list entry.
extraObjects: []
