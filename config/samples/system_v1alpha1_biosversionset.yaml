apiVersion: system.metal.ironcore.dev/v1alpha1
kind: BIOSVersionSet
metadata:
  labels:
    app.kubernetes.io/name: metal-maintenance-operator
    app.kubernetes.io/managed-by: kustomize
  name: biosversionset-sample
spec:
  serverSelector:
    matchLabels:
      metal.ironcore.dev/vendor: dell
  biosVersionTemplate:
    version: P79 v1.46 (01/15/2018)
    serverMaintenancePolicy: OwnerApproval
    image:
      URI: https://example.com/firmware/bios-P79-v1.46.bin
