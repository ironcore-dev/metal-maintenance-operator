                    type: string
                  message:
                    description: Message is the Dell-reported status message.
                    type: string
                  name:
                    description: Name is the job's display name.
                    type: string
                  percentComplete:
                    description: PercentComplete is the Dell-reported completion percentage.
                    format: int32
                    type: integer
                  state:
                    description: State is the Dell-reported raw JobState string.
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
