  group: system.metal.ironcore.dev
  names:
    kind: FirmwareUpdateDell
    listKind: FirmwareUpdateDellList
    plural: firmwareupdatedells
    shortNames:
    - fwud
    singular: firmwareupdatedell
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.state
