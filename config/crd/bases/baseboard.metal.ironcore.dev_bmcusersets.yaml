                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              pendingBMCs:
                description: PendingBMCs is the number of BMCs still in the bootstrap
                  phase.
                format: int32
                type: integer
              totalBMCs:
                description: TotalBMCs is the number of BMCs matched by the selector.
                format: int32
                type: integer
            type: object
        type: object
