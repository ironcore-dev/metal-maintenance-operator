# Sample telemetry ConfigMap for the maintenance operator's event-push
# pipeline.
apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-collector-config
  # The operator reads this ConfigMap from its own POD_NAMESPACE (see
  # cmd/main.go's --telemetry-config-namespace flag). This file names
  # the operator's default install namespace; the kustomization
  # rewrites it if the operator is deployed elsewhere.
  namespace: metal-maintenance-operator-system
data:
  config.yaml: |
    apiVersion: telemetry.metal.ironcore.dev/v1alpha1

    # Subscription reconcile cadence — how often the operator re-verifies
    # subscriptions on event-eligible BMCs. Defends against BMC reboots
    # that silently drop the subscription on their side. Operators can
    # retune without a restart; the running operator picks up the new
    # cadence on its next tick.
    #
    # Bounds: 5s – 24h.
    subscriptionReconcileInterval: 10m

    # Per-Redfish-operation deadline for the subscription manager
    # (subscription create / delete / list). Operators with slow or
    # flaky BMCs may raise this so a single laggy BMC doesn't fail-fast
    # through the reconcile loop.
    #
    # Bounds: 1s – 10m. Unset → 30s default.
    perBMCTimeout: 30s

    # End-to-end pipeline health check: how often the operator fires a
    # Redfish SubmitTestEvent on each subscribed BMC and waits for the
    # event to arrive at the receiver. A Prometheus gauge
    # (redfish_event_pipeline_test_timestamp{result="success|failure"})
    # records the Unix timestamp of each outcome.
    #
    # Bounds: 1m – 7d. Unset or 0 → health check disabled (default).
    # testEventInterval: 1h
    #
    # How long to wait for the round-trip before recording a failure.
    # Bounds: 5s – 5m. Unset → 30s default.
    # testEventTimeout: 30s

    # Vendor/model rows that opt INTO event-based subscription. A BMC
    # matches when its Status.Manufacturer equals Vendor exactly AND
    # its Status.Model is in Models (or Models == ["*"]) AND its
    # Status.FirmwareVersion is >= MinFirmware (when set).
    #
    # Vendor MUST be one of metal-operator's canonical bmc.Manufacturer
    # values: "Dell Inc.", "HPE", "Lenovo", "Supermicro". Short forms
    # ("Dell", "dell") are rejected — metal-operator writes the
    # canonical strings to BMC.Status.Manufacturer and a short form
    # would silently never match.
    #
    # testMessageId is the MessageId passed to Redfish SubmitTestEvent
    # health checks. Required when testEventInterval is set. The accepted
    # format is vendor-specific:
    #   Dell iDRAC:  short registry key without prefix, e.g. "SYS1000"
    #                (newer firmware: "SYS.1.0.SYS1000")
    #   HPE iLO:     full dot-separated form from a registry included in
    #                the subscription's RegistryPrefixes, e.g.
    #                "iLOEvents.1.0.TestAlert"
    #   Lenovo XCC:  full registry form, e.g.
    #                "EventRegistry.1.0.0.FQXSPCA0012I"
    #
    # testSeverity: optional Severity field for SubmitTestEvent. Omit for
    #   Dell (iDRAC rejects unknown parameters on some firmware versions).
    #   Required for HPE — SubmitTestEvent is rejected without it. Use "OK".
    #
    # testOriginOfCondition: optional OriginOfCondition field, sent as a
    #   plain string (HPE iLO and Lenovo XCC reject the Redfish
    #   {"@odata.id": ...} link-object form with a type error). Omit for
    #   Dell. Required for HPE — SubmitTestEvent is rejected without it.
    #   Use "/redfish/v1/Managers/1".
    eventBasedHardware:
      - vendor: "Dell Inc."
        models:
          - PowerEdge R650
          - PowerEdge R750
        minFirmware: "5.10.0"
        # testMessageId: "SYS1000"
      - vendor: HPE
        models: ["*"]
        minFirmware: "2.95"
        # testMessageId: "iLOEvents.1.0.TestAlert"
        # testSeverity: "OK"
        # testOriginOfCondition: "/redfish/v1/Managers/1"
