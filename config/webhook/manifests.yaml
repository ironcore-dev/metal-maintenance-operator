---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-servermaintenance-metal-ironcore-dev-v1alpha1-biossettings
  failurePolicy: Fail
  name: vbiossettings-v1alpha1.kb.io
  rules:
  - apiGroups:
    - servermaintenance.metal.ironcore.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - biossettings
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-servermaintenance-metal-ironcore-dev-v1alpha1-biosversion
  failurePolicy: Fail
  name: vbiosversion-v1alpha1.kb.io
  rules:
  - apiGroups:
    - servermaintenance.metal.ironcore.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - biosversions
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-bmcmaintenance-metal-ironcore-dev-v1alpha1-bmcsettings
  failurePolicy: Fail
  name: vbmcsettings-v1alpha1.kb.io
  rules:
  - apiGroups:
    - bmcmaintenance.metal.ironcore.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - bmcsettings
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-bmcmaintenance-metal-ironcore-dev-v1alpha1-bmcversion
  failurePolicy: Fail
  name: vbmcversion-v1alpha1.kb.io
  rules:
  - apiGroups:
    - bmcmaintenance.metal.ironcore.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - bmcversions
  sideEffects: None
